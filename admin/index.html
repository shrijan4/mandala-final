<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Mandala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="mark"></div>
    <h1>Mandala Admin</h1>
    <p class="sub">Sign in to manage products and orders</p>
    <div class="error-msg" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autocomplete="username" value="admin@mandala.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
    <p class="hint">Default credentials come from your server's .env file (ADMIN_EMAIL / ADMIN_PASSWORD) the first time you run <code>npm run seed</code>.</p>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (getToken()) window.location.href = "products.html";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("show");
      const fd = new FormData(form);
      const btn = form.querySelector("button[type='submit']");
      btn.disabled = true;
      btn.textContent = "Signing In...";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");
        setSession(data.token, data.email);
        window.location.href = "products.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  });
</script>
</body>
</html>
