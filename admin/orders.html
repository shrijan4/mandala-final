<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Mandala Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark"></span> Mandala</div>
    <nav>
      <a href="products.html">Products</a>
      <a href="orders.html" class="active">Orders</a>
    </nav>
    <a href="/" target="_blank" class="view-site">View Storefront →</a>
    <div style="font-size:0.78rem;color:#B8AE9E;margin-top:1rem;" data-admin-email></div>
    <button class="logout-btn" data-logout>Log Out</button>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Orders</h1>
        <p>Every order placed through checkout, saved automatically.</p>
      </div>
    </div>

    <div class="stat-cards" id="stat-cards"></div>

    <table>
      <thead>
        <tr>
          <th>Order #</th>
          <th>Customer</th>
          <th>Date</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="order-rows">
        <tr class="empty-row"><td colspan="6">Loading orders...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="order-modal-title">Order</h2>
      <button id="order-modal-close">&times;</button>
    </div>
    <div id="order-modal-body"></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
